# ==========================================================
# 全局基础配置
# ==========================================================
general:
  seed: 42                  # 全局随机种子（数据划分、模型初始化等）

# ==========================================================
# 路径配置
# ==========================================================
paths:
  xyz_path: "../mace_data_interval.xyz"
  best_model_path: "./models/best_model.pth"
  ckpt_save_dir: "./checkpoints"   # 每5轮保存模型独立文件夹

# ==========================================================
# 数据与数据集配置
# ==========================================================
data:
  max_frames: null            # 最多使用的轨迹帧数，设为 null 则使用全部
  cutoff: 5.0               # 邻居搜索截断半径（Å），必须与模型r_max一致
  batch_size: 2             # 批大小
  train_ratio: 0.9          # 训练集占比，剩余为验证集

# ==========================================================
# 模型结构配置
# ==========================================================
model:
  r_max: 5.0                # 径向基函数最大半径（必须与data.cutoff保持一致）
  num_bessel: 8             # Bessel基函数数量
  num_polynomial_cutoff: 5  # 多项式截断函数阶数
  max_ell: 2                # 球谐函数最大角动量阶数
  num_interactions: 2       # 交互层层数
  correlation: 3            # 体相关阶数（MACE核心超参数）
  hidden_irreps: "32x0e + 32x1o"  # 隐藏层不可约表示
  MLP_irreps: "16x0e"       # MLP层不可约表示

# ==========================================================
# 训练超参数
# ==========================================================
training:
  lr: 1e-3
  num_epochs: 50
  force_weight: 100.0
  grad_clip_norm: 10.0       # 梯度裁剪最大范数，防止梯度爆炸
  save_interval: 5            # 每5轮保存一次模型
  sample_num_per_epoch: 10     # 每轮训练结束输出3帧预测误差

# ==========================================================
# 原子孤立能 E0s (单位: eV)
# 键为原子序数，值为对应孤立原子能量
# ==========================================================
atomic_energies:
  1: -0.28219109    # H
  5: -0.53525320    # B
  6: -0.77850906    # C
  7: -0.84998383    # N
  9: -0.54279591    # F